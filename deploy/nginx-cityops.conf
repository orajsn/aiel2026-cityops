# CityOps Live behind nginx: the built app (static files), the phone-follow relay, and a login on the presenter's side.
# Put this inside a `server { ... }` block (https recommended: the map is cached by a service worker that needs https).
#   __WEB_ROOT__   the folder tools/deploy-static.sh was given (the app ends up in __WEB_ROOT__/aiexperiencelive2026/)
#   __HTPASSWD__   a file made with:  printf 'name:%s\n' "$(openssl passwd -6 'the-password')" | sudo tee __HTPASSWD__
# If you change the address (/aiexperiencelive2026/), change it everywhere here, in tools/deploy-static.sh's second argument and in
# deploy/cityops-follow.service (FOLLOW_BASE).
#
# What needs the login: the app itself, creating a phone-follow session (the presenter's button), and the script manager API
# (nginx tells the relay who is signed in through X-Remote-User). What stays open: the audience's phone page and its live feed,
# which only work with a session's 6-digit code.

location = /aiexperiencelive2026 {
    return 301 /aiexperiencelive2026/;
}

location = /aiexperiencelive2026/follow/api/create {
    auth_basic "CityOps Live";
    auth_basic_user_file __HTPASSWD__;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /aiexperiencelive2026/follow/api/m/ {
    auth_basic "CityOps Live";
    auth_basic_user_file __HTPASSWD__;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header Connection "";
    client_max_body_size 80k;
}

location ^~ /aiexperiencelive2026/follow/ {
    proxy_set_header X-Remote-User "";
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600;
    client_max_body_size 8k;
}

# the app: plain files, behind the login
location ^~ /aiexperiencelive2026/ {
    auth_basic "CityOps Live";
    auth_basic_user_file __HTPASSWD__;
    root __WEB_ROOT__;
    index index.html;
    # the map and the models are big and never change under the same name: let the browser keep them
    location ~* \.(glb|bin|jpe?g|png|webp|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
}
